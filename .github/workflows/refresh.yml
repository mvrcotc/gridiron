name: GridIron refresh

# live lane every 10 minutes (off the :00 marks); daily lane once a day. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
    - cron: "3 9 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "live = lines, injuries, weather, projections, props; daily = also nflverse sources, stats, backtest, full audit"
        type: choice
        options: [live, daily]
        default: live

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gridiron-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick lane
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then lane="${{ inputs.lane }}"
          elif [ "${{ github.event.schedule }}" = "3 9 * * *" ]; then lane=daily
          else lane=live; fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "bucket=$(date -u +%Y-%m-%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2,<3"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-audit --no-fund jsdom@24

      - name: Restore today's nflverse sources
        id: sources
        uses: actions/cache@v4
        with:
          path: |
            data/*.csv
            data/raw/dc.csv
            data/raw/cov.csv
          key: nflverse-${{ steps.lane.outputs.bucket }}

      - name: Refresh, rebuild and audit
        env:
          SOURCES_CACHED: ${{ steps.sources.outputs.cache-hit }}
          GRIDIRON_SITE_URL: https://mvrcotc.github.io/gridiron
        run: python3 refresh.py --lane "${{ steps.lane.outputs.lane }}"

      - name: Save the daily baseline
        if: steps.lane.outputs.lane == 'daily'
        run: |
          git config user.name "gridiron-bot"
          git config user.email "gridiron-bot@users.noreply.github.com"
          git add data/gi2.json pipeline/track.json
          if ! git diff --cached --quiet; then git commit -m "Daily data baseline $(date -u +%F)" && git push; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
