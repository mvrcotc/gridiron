name: GridIron refresh

# live lane every 10 minutes (off the :00 marks); daily lane once a day. GitHub may start scheduled runs late.
on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
    - cron: "3 9 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "live = lines, injuries, weather, projections, props; daily = also nflverse sources, stats, backtest, full audit"
        type: choice
        options: [live, daily]
        default: live
      proposal:
        description: "Model change proposal id, from its GitHub issue (only when approving or declining one)"
        type: string
        default: ""
      decision:
        description: "What to do with that proposal"
        type: choice
        options: [none, approve, reject]
        default: none

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: gridiron-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
      started: ${{ steps.lane.outputs.started }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick lane
        id: lane
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then lane="${{ inputs.lane }}"
            if [ -n "${{ inputs.decision }}" ] && [ "${{ inputs.decision }}" != "none" ]; then lane=daily; fi
          elif [ "${{ github.event.schedule }}" = "3 9 * * *" ]; then lane=daily
          else lane=live; fi
          echo "lane=$lane" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "bucket=$(date -u +%Y-%m-%d)-$(( 10#$(date -u +%H) / 6 ))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "numpy>=2,<3" "pandas>=2,<3"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-audit --no-fund jsdom@24

      - name: Restore today's nflverse sources
        id: sources
        uses: actions/cache@v4
        with:
          path: |
            data/*.csv
            data/raw/dc.csv
            data/raw/cov.csv
          key: nflverse-${{ steps.lane.outputs.bucket }}

      # play-by-play for the live model's weekly review; rebuilt from nflverse only when a review needs newer plays
      - name: Restore the play-by-play history
        if: steps.lane.outputs.lane == 'daily'
        uses: actions/cache@v4
        with:
          path: data/history/history.sqlite
          key: history-${{ steps.lane.outputs.week }}
          restore-keys: history-

      - name: Apply the owner's decision on a model proposal
        if: github.event_name == 'workflow_dispatch' && inputs.decision != 'none'
        env:
          PROPOSAL: ${{ inputs.proposal }}
          DECISION: ${{ inputs.decision }}
        run: |
          python3 refresh.py --stage sources
          python3 pipeline/learn.py "$DECISION" "$PROPOSAL" --update-history

      - name: Refresh, rebuild and audit
        env:
          SOURCES_CACHED: ${{ steps.sources.outputs.cache-hit }}
          GRIDIRON_SITE_URL: https://mvrcotc.github.io/gridiron
        run: python3 refresh.py --lane "${{ steps.lane.outputs.lane }}"

      - name: Save the daily baseline
        if: steps.lane.outputs.lane == 'daily'
        run: |
          git config user.name "gridiron-bot"
          git config user.email "gridiron-bot@users.noreply.github.com"
          git add data/gi2.json pipeline/track.json pipeline/champion.json pipeline/learning
          if ! git diff --cached --quiet; then git commit -m "Daily data baseline and model review $(date -u +%F)" && git pull --rebase -q && git push; fi

      - name: Open an issue for each new model change proposal
        if: steps.lane.outputs.lane == 'daily'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in pipeline/learning/new_proposals/*.md; do
            gh issue create -R "$GITHUB_REPOSITORY" --title "$(head -1 "$f" | sed 's/^## //')" --body-file "$f"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # GitHub runs scheduled workflows late and often skips them. While a game is near, under way or just finished, each run
  # queues the next one itself, about 10 minutes after the previous one started. It never starts a second chain.
  next:
    needs: [refresh, deploy]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue the next refresh during game windows
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ needs.refresh.outputs.started }}
        run: |
          hot=$(curl -fsS --max-time 30 https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard | python3 -c '
          import sys, json, datetime
          d=json.load(sys.stdin); now=datetime.datetime.now(datetime.timezone.utc); hot=False
          for e in d.get("events", []):
              state=((e.get("competitions") or [{}])[0].get("status") or {}).get("type", {}).get("state")
              k=datetime.datetime.fromisoformat(e["date"].replace("Z", "+00:00"))
              if state=="in" or (state=="pre" and (k-now).total_seconds() < 8*3600) or (state=="post" and (now-k).total_seconds() < 5*3600): hot=True
          print("yes" if hot else "no")') || hot=unknown
          echo "game window: $hot"
          [ "$hot" = "yes" ] || exit 0
          started=${STARTED:-$(date +%s)}
          wait=$(( 600 - ( $(date +%s) - started ) ))
          if [ "$wait" -gt 0 ]; then echo "waiting ${wait}s"; sleep "$wait"; fi
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow refresh.yml --limit 20 --json status,databaseId \
                 --jq '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$busy" != "0" ]; then echo "another refresh is already queued or running"; exit 0; fi
          gh workflow run refresh.yml -R "$GITHUB_REPOSITORY" -f lane=live
          echo "next refresh queued"

